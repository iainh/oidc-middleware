[package]
name = "oidc-middleware-macros"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Procedural macros for oidc-middleware."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
