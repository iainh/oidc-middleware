[workspace]
members = [".", "oidc-middleware-macros"]
resolver = "2"

[package]
name = "oidc-middleware"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Quarkus-inspired OIDC middleware for Axum."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["axum", "oidc", "oauth2", "microprofile"]
categories = ["web-programming::http-server", "authentication"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
base64 = "0.22"
getrandom = "0.2"
http = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
mp-config = { path = "../mp-config" }
oidc-middleware-macros = { version = "0.1.0", path = "oidc-middleware-macros" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
tower-layer = "0.3"
tower-service = "0.3"
tower-sessions = "0.14"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trybuild = "1"
