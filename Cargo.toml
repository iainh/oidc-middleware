[workspace]
members = [".", "oidc-middleware-macros"]
resolver = "2"

[package]
name = "oidc-middleware"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Quarkus-inspired OIDC middleware for Axum."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["axum", "oidc", "oauth2", "microprofile"]
categories = ["web-programming::http-server", "authentication"]

[features]
default = ["http-client", "jwt", "macros", "rustls", "web-app"]
http-client = ["dep:reqwest", "dep:url"]
jwt = ["dep:jsonwebtoken"]
macros = ["dep:oidc-middleware-macros"]
native-tls = ["http-client", "reqwest/native-tls"]
rustls = ["http-client", "reqwest/rustls-tls"]
rustls-native-certs = ["http-client", "reqwest/rustls-tls-native-roots"]
web-app = ["http-client", "jwt", "dep:cookie", "dep:getrandom"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
base64 = "0.22"
cookie = { version = "0.18", features = ["percent-encode", "private"], optional = true }
getrandom = { version = "0.2", optional = true }
http = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"], optional = true }
mp-config = { git = "ssh://git@github.com/iainh/mp-config", tag = "v0.1.1" }
oidc-middleware-macros = { version = "0.7.0", path = "oidc-middleware-macros", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trybuild = "1"
